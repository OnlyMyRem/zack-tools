<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cron 表达式生成与解析 · Zack Tools</title>
<meta name="description" content="在线 Cron 表达式工具：可视化生成表达式，自动识别 Spring / Quartz / Linux 三种格式，支持按定位获取推算时区，按任意时区预览未来触发时间。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='25' font-size='25'>%F0%9F%97%93</text></svg>">
<link rel="stylesheet" href="../../assets/css/theme.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="cron.css">
<script src="../../assets/js/registry.js" data-registry></script>
<script src="../../assets/js/theme.js"></script>
</head>
<body data-page="cron">
<main class="wrap">
  <div class="cron-cols">
    <div class="cron-main">
      <section class="panel top-panel">
        <div class="field tz-field">
          <div class="tz-label-row">
            <label class="field-label" for="tz">推算时区</label>
            <button class="tz-locate" type="button" id="tz-locate" title="向浏览器请求地理位置，按坐标推算所在时区">从位置获取</button>
          </div>
          <select id="tz"></select>
        </div>
        <div class="field expr-field">
          <label class="field-label" for="expr">表达式</label>
          <div class="row expr-acts">
            <input id="expr" type="text" autocomplete="off" spellcheck="false" placeholder="0 3 * * 1-5">
            <div class="expr-btns">
              <button class="btn sm" type="button" id="btn-copy-expr">复制表达式</button>
              <button class="btn sm ghost" type="button" id="btn-clear">清空</button>
            </div>
          </div>
          <!-- 小段签只标字段名与原文，不写解释：解释文案长短不一会让卡片高度乱跳，已去掉。 -->
          <div class="seg-labels" id="seg-labels"></div>
        </div>
        <div class="field">
          <label class="field-label">格式</label>
          <div class="fmt-bar">
            <div class="chips" id="format-chips" role="radiogroup" aria-label="Cron 格式"></div>
            <button class="btn sm ghost cheat-btn" type="button" id="btn-cheat">字段速查</button>
          </div>
        </div>
        <div class="fmt-hints" id="fmt-hints"></div>
        <p class="note" id="status"></p>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>未来触发时间</h2>
          <div class="row">
            <label class="field-label" for="count">次数</label>
            <select id="count" style="width:auto">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="50">50</option>
            </select>
            <button class="btn sm" type="button" id="btn-copy-times">复制全部</button>
          </div>
        </div>
        <p class="sched-line" id="sched-line" aria-live="polite"></p>
        <div class="times" id="times"></div>
      </section>
    </div>

    <aside class="cron-rail" aria-label="常用预设与字段生成器">
      <section class="panel">
        <div class="rail-tabs" role="tablist" aria-label="表达式辅助工具">
          <button class="tab on" type="button" role="tab" id="tab-presets" aria-selected="true" aria-controls="pane-presets">常用预设</button>
          <button class="tab" type="button" role="tab" id="tab-builder" aria-selected="false" aria-controls="pane-builder">字段生成器</button>
        </div>
        <div class="rail-pane on" id="pane-presets" role="tabpanel" aria-labelledby="tab-presets">
          <div class="preset-groups" id="presets"></div>
          <p class="rail-note">
            点击条目载入表达式；预设不改动上方格式。条目按当前格式渲染：能无损表达的点击即载入
            （跨格式会自动折算，悬停可看到实际载入的写法）；当前格式表达不了的（秒级粒度、L / W / #、
            年字段等）会置灰不可选，悬停或点击能看到原因。
          </p>
        </div>
        <div class="rail-pane" id="pane-builder" role="tabpanel" aria-labelledby="tab-builder">
          <div class="builder" id="builder"></div>
        </div>
      </section>
    </aside>
  </div>

</main>

<dialog id="cheat-dialog" aria-labelledby="cheat-title">
  <div class="dlg-head">
    <h2 id="cheat-title">字段速查</h2>
    <button class="icon-btn" id="btn-cheat-close" type="button" aria-label="关闭">✕</button>
  </div>
  <p class="dlg-sub">三种方言（Linux / Spring / Quartz）共用同一批字段，差异都列在下面。</p>
  <div class="table-wrap">
    <table class="tbl" id="cheatsheet">
      <thead>
        <tr><th>字段</th><th>取值</th><th>特殊符号</th><th>说明</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</dialog>
<script src="../../assets/js/time.js"></script>
<script src="../../assets/js/utils.js"></script>
<script src="../../assets/js/shell.js"></script>
<script src="cron-parser.js"></script>
<script src="cron.js"></script>
</body>
</html>
